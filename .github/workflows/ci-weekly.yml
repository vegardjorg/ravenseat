# Weekly CI for Ravenseat: the full suite on Windows with node 20, the slowest job (about 30 min), off the push path.
# `engines` still says node >=20, so it keeps running; once a week and on demand (Actions tab, Run workflow) is enough
# for an end-of-life node that the push jobs already cover on Ubuntu. One job, unsharded: nobody waits for it, and a
# single run needs no check that the shards together ran every file.
# Actions are pinned by commit SHA (the tag in the comment), so a moved tag cannot change what runs here.
name: CI weekly

on:
  schedule:
    # Mondays 03:17 UTC (off the hour, when the runners are less busy).
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (windows-latest, node 20)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Many tests build throwaway git repos; most pass an identity with -c, this covers the rest.
      - name: Git identity for test repos
        run: |
          git config --global user.name "ravenseat-ci"
          git config --global user.email "ravenseat-ci@example.invalid"
      - run: npm ci
      - run: npm test
